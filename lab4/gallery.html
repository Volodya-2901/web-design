<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Галерея Кейвана Володимира Івановича</title>
    <link rel="stylesheet" href="gallery.css">
</head>
<body>


    <h1>Галерея Кейвана Володимира Івановича</h1>

    <a href="index.html" class="back-link">Назад на головну</a>

    <h2>Мої зображення</h2>

    <main class="gallery-grid">
        <section class="gallery-item">
            <h3 class="title-this-folder">Зображення у цій папці</h3>

            <img src="photo1.png"
                 alt="Зображення в поточній папці"
                 width="640"
                 height="480">
        </section>

        <section class="gallery-item">
            <h3 class="title-subfolder">Зображення у папці</h3>

            <img src="images/photo2.png"
                 alt="Зображення в підпапці"
                 width="640"
                 height="480">
        </section>

        <section class="gallery-item">
            <h3 class="title-online">Зображення онлайн</h3>

            <img src="https://placehold.co/1280x1024.png"
                 alt="Зображення онлайн"
                 width="1280"
                 height="1024">
        </section>
    </main>

</body>
</html>
